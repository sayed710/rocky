services:
  postgres:
    # Postgres 16 plus the `vector` extension, required by migration 0014
    # (ADR-0059). There is no alpine variant of the pgvector image.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: gambit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gambit_dev}
      POSTGRES_DB: gambit
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gambit -d gambit"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 30s
      retries: 10
    command: ["redis-server", "--appendonly", "yes"]

  api:
    # Pinned because the image carries Stockfish 16, and release `sf_16` publishes no linux/arm64
    # build — `stockfish-ubuntu-x86-64.tar` and its `-modern`/`-avx2` siblings are the only Linux
    # assets. Debian's package, which M15 Increment 12 replaced, resolved per-architecture, so
    # without this line `docker compose up --build` stops with the artefact stage's architecture
    # error on an arm64 workstation — a local stack that used to work.
    #
    # amd64 under emulation is slower than a native engine but it runs, which beats not building.
    # `release.yml` sets no `platforms:`, so the published images have always been amd64 and this
    # changes nothing about production. Raised in the Qodo review of PR #143.
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://gambit:${POSTGRES_PASSWORD:-gambit_dev}@postgres:5432/gambit
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:-dev-secret-change-me-in-production-at-least-32-bytes!!}
      PORT: "8080"
      TRUST_PROXY: "1"
      # Local development explicitly selects the safe, non-delivering console sender. Production
      # Helm deployments require Resend and fail startup when its configuration is missing.
      NODE_ENV: development
      EMAIL_PROVIDER: console
      # The Compose stack is served over localhost HTTP. The API otherwise defaults to Secure and
      # rejects this opt-out unless NODE_ENV is exactly development.
      REFRESH_COOKIE_SECURE: "false"
      # Engine analysis (ADR-0113). The image installs Stockfish and sets STOCKFISH_PATH, so the
      # analysis pool is available; these only tighten it. The pool is deliberately small and its
      # queue short — analysis is a CPU-amplification surface, so saturation should be refused
      # quickly rather than absorbed. Set ANALYSIS_ENGINE_MAX_WORKERS=1 on a constrained host.
      # Values above the built-in ceilings are clamped down; env can tighten limits, never loosen.
      ANALYSIS_ENGINE_MAX_WORKERS: ${ANALYSIS_ENGINE_MAX_WORKERS:-2}
      ANALYSIS_ENGINE_QUEUE_CAPACITY: ${ANALYSIS_ENGINE_QUEUE_CAPACITY:-32}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  gateway:
    # Same reason as `api` above: this image ships Stockfish 16 and `sf_16` has no arm64 asset.
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.gateway
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Shared durable event log: the gateway persists game events to (and
      # rehydrates them from) the same Postgres store the API writes. The API
      # runs migrations on startup, so the schema exists before the gateway
      # starts (it waits on api being healthy).
      DATABASE_URL: postgres://gambit:${POSTGRES_PASSWORD:-gambit_dev}@postgres:5432/gambit
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:-dev-secret-change-me-in-production-at-least-32-bytes!!}
      ACCESS_TOKEN_TTL_SEC: "900"
      PORT: "4175"
      HOST: "0.0.0.0"
      NODE_ENV: production
      TRUST_PROXY: "1"
      # Redis pub/sub for multi-node fanout (M14 inc 3, ADR-0008).
      REDIS_URL: redis://redis:6379
      # Tournament result reporter (M9 inc 13, ADR-0025): records tournament
      # and arena results from ended-game broadcasts. Single gateway node in
      # compose, so exactly one reporter instance runs.
      TOURNAMENT_REPORTER: ${TOURNAMENT_REPORTER:-1}
      # "Play vs Computer" (M14 inc 13, ADR-0080). The gateway builds an EngineBotMover only when
      # this is "1" and STOCKFISH_PATH points at a real binary — the image installs Stockfish and
      # sets that path. Without this the lobby offers the mode and the opponent never moves.
      ENGINE_BOT: ${ENGINE_BOT:-1}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4176/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    depends_on:
      api:
        condition: service_healthy
      gateway:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
