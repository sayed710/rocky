name: Live Provider Contract Tests

# Dedicated, manual-only workflow for live third-party AI provider contract tests.
# These tests make real network calls to OpenAI / Anthropic APIs and require live API keys.
# Per repository policy:
# - They MUST NOT run in automatic PR CI.
# - They MUST NOT be marked as passed when credentials are unavailable.
# - They execute strictly on demand when credentials are provided in repository secrets.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-provider-contract:
    name: live provider contract tests (OpenAI + Anthropic)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies (reproducible)
        run: npm ci

      - name: Build (dependency order)
        run: npm run build

      - name: Verify credentials presence
        run: |
          if [ -z "${OPENAI_API_KEY}" ] && [ -z "${ANTHROPIC_API_KEY}" ]; then
            echo "::error::Neither OPENAI_API_KEY nor ANTHROPIC_API_KEY is provided in secrets."
            exit 1
          fi
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Test AI orchestrator live provider contract
        run: npm run test:live-provider --workspace @chess-platform/ai-orchestrator
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Test AI features live provider contract
        run: npm run test:live-provider --workspace @chess-platform/ai-features
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
