name: CI

# Build, typecheck, and test every workspace package on each push and PR.
# Dependency order matters: downstream packages resolve upstream types from
# built `dist/`, so we BUILD before we lint/test. The root `build`, `lint`,
# and `test` scripts already fan out to the packages in dependency order
# (core -> game -> realtime-gateway -> persistence -> api -> engine -> web).

# Documentation-only changes skip this 24-minute suite, with one exception carved back in.
#
# ADR-0121 is markdown *and* one of the four places the Stockfish pin is written down, so a blanket
# `paths-ignore: ['**/*.md']` meant an ADR-only pin edit started nothing and the four-file invariant
# `scripts/check-engine-pin-parity.mjs` claims went unenforced for one of its own files. Path filters
# do express the exception — a later `!` pattern overrides an earlier match, and a later positive
# pattern overrides that — so the ADR is added back after markdown is removed. Raised in the Qodo and
# CodeRabbit reviews of PR #143.
#
# `pin-parity.yml` covers the same case in seconds and still runs; this is the belt to its braces,
# and it is here because the gap Qodo named was in *this* file's triggers.
on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!**/*.md'
      - 'docs/adr/0121-deterministic-engine-install-in-ci.md'

  pull_request:
    branches: [main]
    paths:
      - '**'
      - '!**/*.md'
      - 'docs/adr/0121-deterministic-engine-install-in-ci.md'

permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detects which areas a change touches so the heavier, area-specific jobs
  # (gateway service, M6 Playwright/Lighthouse acceptance, Helm) can skip when a
  # change cannot affect them — the biggest Actions-minute saver for backend- or
  # test-only changes. Fail-open: if the diff base can't be resolved, every gated
  # job runs. Gated jobs are SKIPPED (not removed), so any required status check
  # still resolves as successful.
  changes:
    name: detect changed areas
    runs-on: ubuntu-latest
    outputs:
      gateway: ${{ steps.filter.outputs.gateway }}
      web: ${{ steps.filter.outputs.web }}
      deploy: ${{ steps.filter.outputs.deploy }}
      images: ${{ steps.filter.outputs.images }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compute changed areas
        id: filter
        run: |
          gateway=true; web=true; deploy=true; images=true
          base=""; head="HEAD"
          case "${{ github.event_name }}" in
            pull_request)
              base="${{ github.event.pull_request.base.sha }}"
              head="${{ github.event.pull_request.head.sha }}"
              ;;
            push)
              b="${{ github.event.before }}"
              [ "$b" != "0000000000000000000000000000000000000000" ] && base="$b"
              head="${{ github.sha }}"
              ;;
          esac
          changed=""
          if [ -n "$base" ] && git cat-file -e "${base}^{commit}" 2>/dev/null; then
            changed="$(git diff --name-only "${base}...${head}" 2>/dev/null || true)"
          fi
          if [ -n "$changed" ]; then
            printf 'Changed files:\n%s\n' "$changed"
            grep -qE '^(services/gateway/|packages/realtime-gateway/|packages/game/|packages/core/|packages/api/|packages/web/|scripts/(nginx-trusted-edge-acceptance|nginx-web-delivery-acceptance|lib/wait-for-health)\.mjs|docker/web/nginx\.conf\.template|package(-lock)?\.json|\.github/workflows/)' <<<"$changed" && gateway=true || gateway=false
            grep -qE '^(packages/web/|packages/e2e-harness/|packages/api/|packages/game/|packages/realtime-gateway/|packages/core/|package(-lock)?\.json|\.github/workflows/)' <<<"$changed" && web=true || web=false
            grep -qE '^(deploy/|\.github/workflows/)' <<<"$changed" && deploy=true || deploy=false
            # Only what changes how an image is *built*. Application code is already compiled by
            # build-test on every run, so rebuilding both images to compile it again would double a
            # cost that buys nothing; what this job proves is the image recipe — the pinned engine,
            # the runtime libraries, the paths — and that changes only in these files.
            #
            # `.dockerignore` defines the build context both images are built from, and any
            # `package.json`/lockfile at any depth is installed by one of them — `Dockerfile.gateway`
            # runs its own `npm ci --prefix services/gateway` against that service's manifests, which
            # the gateway job installs on the runner rather than inside `node:22-slim`. A dependency
            # that works in one and not the other would otherwise first fail at release. Both raised
            # in the Qodo review of PR #143.
            #
            # Named workflows rather than all of `.github/workflows/`, unlike the gates above: these
            # two are the only ones that build these images — `ci.yml` defines the job below,
            # `release.yml` publishes them on a tag — so editing `deploy.yml` or `chaos.yml` would
            # otherwise spend an image build proving nothing. A new workflow that builds an image
            # belongs on this list. Also raised in the Qodo review of PR #143.
            #
            # `docker/` is here because `Dockerfile.web` copies `docker/web/nginx.conf.template`
            # into the shipped web image, where the entrypoint renders it with `envsubst` at
            # container start. A broken proxy config is therefore not a build error at all, and
            # before this it first surfaced at a release tag. The job below builds and checks all
            # three published images, so this filter and that job now cover the same set — which is
            # the property that makes the filter honest. Raised in the Qodo review of PR #143.
            grep -qE '(^|/)(Dockerfile[^/]*|\.dockerignore|package(-lock)?\.json)$|^docker/|^\.github/workflows/(ci|release)\.yml$' <<<"$changed" && images=true || images=false
          else
            echo "No diff base resolved; running all gated jobs (fail-open)."
          fi
          {
            echo "gateway=$gateway"
            echo "web=$web"
            echo "deploy=$deploy"
            echo "images=$images"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved: gateway=$gateway web=$web deploy=$deploy images=$images"

  build-test:
    name: build + typecheck + test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.x', '24.x']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies (reproducible)
        run: npm ci

      - name: Build (dependency order)
        run: npm run build

      - name: Typecheck (tsc --noEmit)
        run: npm run lint

      - name: Test (node --test)
        run: npm test

      # `deploy/load` is an on-demand harness that CI never runs (ADR-0065), so nothing else would
      # notice its correctness guards rotting: the per-IP socket budget, the alternating move plan
      # that produces the cross-node forwarding, and the frame checks that decide whether a run
      # measured anything. These are pure functions and a few file reads — seconds, no services.
      - name: Load harness contract tests
        run: npm run test:load-harness

      - name: POSIX API tests
        run: npm run test:posix -w @chess-platform/api

      - name: POSIX load harness tests
        run: npm run test:load-harness:posix

      # The container images build with their own package chain, which CI never exercises — it
      # builds from the root chain instead. That gap let `docker compose up --build` stay broken
      # from M11 inc 5 onwards while every gate here was green. Static, so it costs seconds.
      - name: Docker build-order check
        run: npm run check:build-order

      # Runs here rather than in the deploy-gated helm job because an ADR can be invalidated by ANY
      # change: the drift that motivated this guard was a source file being renamed while an ADR kept
      # pointing at the old path. Note the workflow's `paths-ignore: ['**/*.md']` — a markdown-only
      # edit does not trigger CI at all, so this catches code moving away from the ADRs, which is the
      # direction that actually rots (ADR-0079).
      - name: ADR claim check
        run: npm run check:adr-claims

      # `scripts/ci-local.mjs` lets a developer run this workflow's checks on their own machine —
      # which matters when Actions is unavailable, as it was for the whole of 2026-08-06. A local
      # runner is only worth trusting while it still matches this file, and the way it stops
      # matching is a new job landing here that nobody mirrors. This is the guard for that.
      - name: CI parity check (scripts/ci-local.mjs vs this file)
        run: npm run check:ci-parity

      # The supported-variant list is written out seven times across TypeScript and SQL, and
      # nothing derives from anything else. The build does not catch a disagreement between the
      # types and the schema: with a new variant added to every TypeScript site, `npm run build`,
      # `npm run lint` and the whole test suite stay green while `studies.variant`'s CHECK
      # constraint rejects it — a constraint violation in production, not here. Static, milliseconds.
      - name: Variant list parity check
        run: npm run check:variant-parity

      # The Stockfish pin is written out in four places now: this workflow, both production
      # Dockerfiles, and ADR-0121. Nothing derives from anything else. The failure worth catching
      # is a partial upgrade — the release moved here but not in the images — because that is how
      # production came to be running Debian's Stockfish 15.1 while this job proved 16, which is
      # what M15 Increment 12 fixed. Static, milliseconds.
      - name: Engine pin parity check
        run: npm run check:engine-pin-parity

      # The guard above parses TypeScript and replays a migration directory, so it has enough
      # logic of its own to be wrong quietly — the failure that matters is it passing while it has
      # stopped looking at anything. These drive it against synthetic sources: a commented-out
      # entry, a forward migration, a constraint replaced rather than edited, a renamed
      # declaration. Pure functions over temp files, no services.
      # Every test file in the repository must belong to an explicit, appropriately provisioned suite.
      - name: Test topology check
        run: npm run check:test-topology

      - name: Guard script tests
        run: npm run test:scripts


  # Builds the three production images (API + gateway + web) and looks inside them.
  #
  # `release.yml` builds these, but only on a `v*` tag — so until M15 Increment 12 nothing checked
  # them before a release was already being cut, and the images had drifted: they installed whatever
  # Debian's mirror resolved (`stockfish 15.1-4` on bookworm) while the analysis-smoke job proved the
  # engine boundary against Stockfish 16. Production ran a version no test had ever exercised, and a
  # base-image bump to trixie would have moved it again with no commit of ours.
  #
  # This job is the check that could not otherwise happen before merge. It is deliberately narrow:
  # it proves the *recipe* — the pinned engine is present, executes, identifies itself, resolves its
  # libraries, and carries its licence material — not the application, which build-test already
  # compiles on every run. Gated on the files that change how an image is built, so an ordinary code
  # change does not pay for image builds.
  docker-images:
    name: production image build (API + gateway + web)
    needs: changes
    if: needs.changes.outputs.images == 'true'
    runs-on: ubuntu-latest
    # Two full server image builds (API and gateway), each compiling the server packages from scratch
    # without the npm cache action, alongside the web image built and checked separately. Twenty
    # minutes is generous against that and still bounds a stall, as on analysis-smoke.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # `load: true` so the images land in the local daemon to be inspected. Nothing is pushed:
      # publishing stays release.yml's job, on a tag.
      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.api
          push: false
          load: true
          tags: gambit-api:ci

      - name: Build gateway image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.gateway
          push: false
          load: true
          tags: gambit-gateway:ci

      - name: Build web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.web
          push: false
          load: true
          tags: gambit-web:ci

      # Both Dockerfiles already assert identity and library resolution in their runtime stage, so a
      # broken image cannot be built at all — including by `release.yml`, which never runs this job.
      # What this step adds is the same checks against the *finished container*, entered the way it
      # is actually run: as `USER node`, after every later layer has landed. A binary that is fine
      # during the build but not readable or executable by the runtime user would pass there and
      # fail here, and the licence material is confirmed to have survived into the final image.
      - name: Verify Stockfish inside both images
        run: |
          set -euo pipefail
          for image in gambit-api:ci gambit-gateway:ci; do
            echo "::group::${image}"
            docker run --rm "${image}" sh -eux -c '
              test -x "$STOCKFISH_PATH"
              ldd "$STOCKFISH_PATH" > /tmp/ldd.txt
              cat /tmp/ldd.txt
              ! grep -q "not found" /tmp/ldd.txt
              printf "uci\nquit\n" | "$STOCKFISH_PATH" > /tmp/uci.txt
              grep -q "id name Stockfish 16" /tmp/uci.txt
              test -s /usr/local/share/stockfish/Copying.txt
              test -d /usr/local/share/stockfish/src

              # ADR-0121 claims the 41.6 MB archive never reaches a shipped layer. That was true by
              # construction — the runtime stage copies two paths out of the artefact stage and the
              # tar is in neither — but nothing asserted it, and a later `COPY --from=stockfish
              # /out/ ...` widened by one character would ship it silently.
              #
              # The positive control runs first on purpose: a bare "find turned up nothing" passes
              # just as happily when the scan itself is broken, which is the vacuous guard this
              # repository has already been bitten by. Proving the scan can see the binary means the
              # empty result below is evidence rather than an absence of evidence.
              find / -xdev -type f -name "stockfish" > /tmp/found.txt 2>/dev/null || true
              grep -qx "/usr/local/bin/stockfish" /tmp/found.txt
              find / -xdev -type f -name "stockfish*.tar" > /tmp/tars.txt 2>/dev/null || true
              cat /tmp/tars.txt
              ! test -s /tmp/tars.txt
            '
            echo "::endgroup::"
          done

      # The web image carries no engine, so it gets its own check rather than a branch inside the
      # loop above. What can break here is different in kind: `Dockerfile.web` copies
      # `nginx.conf.template` into `/etc/nginx/templates/` and the entrypoint renders it with
      # `envsubst` when the container starts. A malformed proxy block is therefore not a build
      # failure — the image builds clean and dies on boot — and `release.yml` publishes this image
      # too, so before this the first thing to exercise the template was a release. Raised in the
      # Qodo review of PR #143.
      - name: Verify the web image renders a valid nginx config
        run: |
          set -euo pipefail
          echo "::group::gambit-web:ci"
          # Loopback upstreams because `nginx -t` resolves a literal `proxy_pass` host at config-load
          # time; the compose defaults (`api`, `gateway`) do not exist on a runner and would fail for
          # a reason that has nothing to do with the template being correct.
          docker run --rm \
            -e API_UPSTREAM=127.0.0.1:8080 \
            -e GATEWAY_UPSTREAM=127.0.0.1:4175 \
            gambit-web:ci sh -eux -c '
              rendered=/etc/nginx/conf.d/default.conf
              /docker-entrypoint.sh nginx -t
              cat "$rendered"

              # envsubst actually ran and put the upstreams in.
              #
              # `-F` throughout: every pattern here is a literal line from the config, and two of
              # them carry nginx variables. A bare `grep` reads them as basic regular expressions,
              # where `$` is literal only because it happens to sit mid-pattern — drop the trailing
              # `;` from one of these and the `$` silently becomes an end-anchor, changing what the
              # assertion means without changing how it looks. Fixed strings say what is meant.
              # Raised in the Qodo review of PR #143.
              grep -qF "proxy_pass http://127.0.0.1:8080;" "$rendered"
              grep -qF "proxy_pass http://127.0.0.1:4175;" "$rendered"

              # ...and NGINX_ENVSUBST_FILTER kept it away from the variables nginx defines itself.
              # Without that filter these expand to empty and the proxy silently loses its headers,
              # which is the failure `Dockerfile.web` documents in a comment and nothing tested.
              # `$http_host` is load-bearing here: `$host` drops the port, and that broke every
              # browser WebSocket upgrade with a 401 until it was changed.
              grep -qF "proxy_set_header Host \$http_host;" "$rendered"
              grep -qF "try_files \$uri \$uri/ /index.html;" "$rendered"

              test -s /usr/share/nginx/html/index.html
            '
          echo "::endgroup::"

      # Reported rather than asserted: an image-size threshold in CI turns every legitimate
      # dependency change into a failure here, which is not what this job is for. The numbers are
      # printed so a reviewer can see what the change actually cost.
      - name: Report image and engine footprint
        run: |
          set -euo pipefail
          for image in gambit-api:ci gambit-gateway:ci; do
            size=$(docker image inspect "${image}" --format '{{.Size}}')
            printf '%-22s total image %s MB\n' "${image}" "$((size / 1000000))"
            docker run --rm "${image}" sh -c \
              'du -sk "$STOCKFISH_PATH" /usr/local/share/stockfish | awk "{printf \"  %-34s %6.1f MB\\n\", \$2, \$1/1024}"'
          done
          # No engine footprint line: the web image ships nginx and the built SPA, not Stockfish.
          web_size=$(docker image inspect gambit-web:ci --format '{{.Size}}')
          printf '%-22s total image %s MB\n' "gambit-web:ci" "$((web_size / 1000000))"

  # Runs the Postgres-gated integration tests (persistence event store +
  # repositories against a real database). Everything else is hermetic.
  postgres-integration:
    name: postgres integration (persistence)
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector/pgvector:pgNN is the stock Postgres image plus the `vector`
        # extension. Required from migration 0014 (ADR-0059): the search
        # embeddings table needs CREATE EXTENSION vector, and migrate() applies
        # every migration unconditionally, so plain postgres:16 would fail this
        # whole job rather than just the pgvector tests.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: chess
          POSTGRES_PASSWORD: chess
          POSTGRES_DB: chess_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U chess"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://chess:chess@localhost:5432/chess_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies (reproducible)
        run: npm ci

      - name: Build (dependency order)
        run: npm run build

      - name: Test persistence against Postgres
        run: npm run test:integration:postgres --workspace @chess-platform/persistence

      - name: Test API concurrency controls against Postgres
        run: npm run test:integration:postgres --workspace @chess-platform/api

      - name: Test scripts integration against Postgres
        run: npm run test:scripts:integration

  # The only job that runs a real engine binary (ADR-0113). Every other analysis test drives a
  # fake transport or a provider double, which keeps the main suite hermetic but leaves the
  # production composition — env parsing, subprocess spawn, UCI handshake, capability discovery,
  # platform-to-engine variant mapping — proven by nothing. ADR-0102 is the record of what that
  # costs: fifty green engine tests while `standard` failed against a real binary in production.
  # Installing Stockfish here rather than in build-test keeps that dependency off every other job.
  #
  # It is also the only job with both an engine binary and a database (ADR-0138). The durable
  # analysis cache is composed from two halves proven separately — the orchestrator against fake
  # caches, the adapter against a real PostgreSQL server — and until this job gained a database
  # nothing anywhere ran the two together with a real search between them. That left the one claim
  # the feature exists to make, "a replica that never ran this search still answers it", resting on
  # a `FakeEngineTransport`. The database is added HERE rather than the engine being added to
  # `postgres-integration` for two reasons: the Stockfish pin stays written down once in this file
  # (`scripts/check-engine-pin-parity.mjs` treats this workflow as one location), and every job that
  # spawns a real engine stays this one. The cost is a service container on a job that had none;
  # see ADR-0138 for the measurement.
  analysis-smoke:
    name: analysis smoke (real Stockfish + Fairy-Stockfish + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      # The same image `postgres-integration` uses, and for the same reason: migration 0014 needs
      # `CREATE EXTENSION vector`, and the canonical runner applies every migration or none, so
      # plain `postgres:16` would fail before reaching 0026/0027.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: chess
          POSTGRES_PASSWORD: chess
          POSTGRES_DB: chess_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U chess"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://chess:chess@localhost:5432/chess_test
    # A healthy run of this job was 37-71 seconds before it gained a database, of which the build is
    # 41. Waiting for the service container and running the real-stack test add to that, and the
    # ceiling is unchanged because it was never sized against the median: fifteen minutes is many
    # times either figure, so a cold npm cache or a slow runner cannot trip it, while an
    # infrastructure stall is capped at fifteen minutes instead of the six-hour default. That
    # default is what let one stalled run burn 34 minutes before a human noticed and cancelled it
    # during the Increment 9 post-merge check.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      # Was `apt-get update && apt-get install stockfish`, which put the Ubuntu/Azure package
      # mirror on the critical path of the one job that proves the engine boundary works. Over the
      # thirty runs before this change that step had a median of 18s but a mean of 184s: ten runs
      # over a minute, eight over three, and one that reached 34 minutes before being cancelled by
      # hand - 92 minutes of Actions time in total, to install a dependency for a ten-second test.
      # The Fairy step below has never shown that tail, so this copies its model exactly.
      #
      # `sf_16` is the same version the mirror was serving (`stockfish 16-1build1`), so the engine
      # under test does not change; only how it arrives does. The plain `x86-64` asset is the
      # baseline build - the `-modern` and `-avx2` assets need instruction sets a hosted runner is
      # not guaranteed to have, and all three are byte-for-byte the same *size*, so the digest below
      # is what actually tells them apart. The archive member name is the second guard on that:
      # `-modern` and `-avx2` ship their binary under their own name, so asking for this one by
      # path fails rather than silently yielding a CPU-specific build.
      #
      # Checksum before extraction, extraction before chmod, chmod before execution. The digest is
      # pinned here and was computed from the release asset independently, never from the bytes
      # being verified. GitHub publishes no digest of its own for this asset (`digest: null`) and a
      # release asset is replaceable, so the pin is the whole integrity story.
      - name: Install Stockfish
        env:
          STOCKFISH_SHA256: efca1c60ec11fd9628425f3ee40644ad1618535ddf881c16385a86f7fc9e0983
        run: |
          set -euo pipefail
          curl -sSL --fail --retry 3 -o /tmp/stockfish.tar \
            https://github.com/official-stockfish/Stockfish/releases/download/sf_16/stockfish-ubuntu-x86-64.tar
          echo "${STOCKFISH_SHA256}  /tmp/stockfish.tar" | sha256sum --check --strict -
          # One member, by exact path. `tar` exits non-zero when it is not in the archive, so a
          # changed layout fails here rather than leaving a later step to find nothing.
          tar -xf /tmp/stockfish.tar -C /tmp --strip-components=1 stockfish/stockfish-ubuntu-x86-64
          mv /tmp/stockfish-ubuntu-x86-64 /tmp/stockfish
          chmod +x /tmp/stockfish

      # Fairy-Stockfish is the engine every variant routes to, and Debian does not package it.
      # Pinned to the release the Three-Check FEN contract was verified against (ADR-0120): the
      # counter field is engine behaviour, so an unpinned upgrade could change what "3+3" means
      # without any change of ours. A single ~2MB download, not a build.
      #
      # Checksummed because a release asset is mutable and CI executes this as a native binary.
      # The UCI name check below cannot stand in for it: a replaced asset would report whatever
      # name it liked. Raised in the Qodo and CodeRabbit reviews of PR #140.
      - name: Install Fairy-Stockfish
        env:
          FAIRY_SHA256: ab6b85823152e78654092dc2fbb154956a559c6ef0455d728268544390ee150f
        run: |
          set -euo pipefail
          curl -sSL --fail --retry 3 -o /tmp/fairy-stockfish \
            https://github.com/fairy-stockfish/Fairy-Stockfish/releases/download/fairy_sf_14/fairy-stockfish_x86-64
          echo "${FAIRY_SHA256}  /tmp/fairy-stockfish" | sha256sum --check --strict -
          chmod +x /tmp/fairy-stockfish

      - name: Install dependencies (reproducible)
        run: npm ci

      - name: Build (dependency order)
        run: npm run build

      # Both smoke files self-skip when their binary is unset, so a missing one would make this
      # job pass while proving nothing. Assert each is really there, and that each is the pinned
      # version it claims to be, before trusting the result.
      #
      # Stockfish is asked to identify itself for the same reason Fairy always has been, and for
      # one more: it is a downloaded binary now rather than a distribution package, so this is also
      # where a missing shared library or an incompatible architecture surfaces - as a failure here,
      # naming the step, rather than as a confusing spawn error inside the test run.
      - name: Verify the engine binaries and the database are present
        run: |
          set -euo pipefail
          test -x /tmp/stockfish
          test -x /tmp/fairy-stockfish
          # The real-stack test self-skips without a database exactly as the other two self-skip
          # without a binary, so the database needs the same assertion or the job goes green having
          # silently dropped the one proof it was extended to carry.
          test -n "${DATABASE_URL}"
          printf "uci\nquit\n" | /tmp/stockfish | tee /tmp/stockfish-uci.txt > /dev/null
          grep -q "id name Stockfish 16" /tmp/stockfish-uci.txt
          printf "uci\nquit\n" | /tmp/fairy-stockfish | tee /tmp/fairy-uci.txt > /dev/null
          grep -q "id name Fairy-Stockfish 14" /tmp/fairy-uci.txt
          grep -q "var 3check" /tmp/fairy-uci.txt

      - name: Analysis smoke test against real engines and a real database
        run: npm run test:analysis-smoke --workspace @chess-platform/api
        env:
          STOCKFISH_PATH: /tmp/stockfish
          FAIRY_STOCKFISH_PATH: /tmp/fairy-stockfish

  # Builds, typechecks, and tests the deployable gateway service. It is NOT a
  # root workspace, so the build-test job above never compiles it — this job is
  # its only CI coverage. The single-owner command-routing suite (ADR-0010)
  # runs against a real Redis.
  gateway-service:
    name: gateway service (build + Redis integration)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.gateway == 'true'
    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # This job runs repository-controlled build/lint/test scripts and
          # needs no authenticated Git access, so don't leave the token in
          # .git/config for those scripts to read.
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install workspace dependencies (reproducible)
        run: npm ci

      - name: Build domain packages (dependency order)
        run: npm run build

      - name: Install gateway service dependencies (reproducible)
        run: npm ci
        working-directory: services/gateway

      - name: Build + typecheck gateway service
        run: npm run build && npm run lint
        working-directory: services/gateway

      - name: Test gateway service against Redis
        run: npm test
        working-directory: services/gateway

      - name: Test trusted edge through real Nginx
        run: npm run test:trusted-edge
        working-directory: services/gateway
        env:
          REQUIRE_DOCKER: '1'

      - name: Test web delivery caching and compression through real Nginx
        run: npm run test:web-delivery
        working-directory: services/gateway
        env:
          REQUIRE_DOCKER: '1'

  # M6 acceptance gate: Playwright e2e (full game vs bot + vs human) +
  # Lighthouse a11y audit (score must be >= 95). Runs the e2e harness
  # (in-memory API + gateway + bot) alongside vite preview so the specs
  # exercise real HTTP + WebSocket flows. Reports are uploaded as artifacts.
  m6-acceptance:
    name: M6 acceptance (Playwright e2e + Lighthouse a11y)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies (reproducible)
        run: npm ci

      - name: Build (dependency order, includes e2e-harness)
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install chromium
        working-directory: packages/web

      - name: Run Playwright e2e (GAMBIT_E2E_BACKEND=1)
        run: npm run e2e
        working-directory: packages/web
        env:
          GAMBIT_E2E_BACKEND: '1'

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/web/playwright-report/
          retention-days: 30

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: packages/web/test-results/
          retention-days: 30

      - name: Run Lighthouse a11y audit
        run: |
          # Start vite preview in the background
          npx vite preview --port 4173 --host 127.0.0.1 &
          VITE_PID=$!
          trap 'kill $VITE_PID 2>/dev/null || true' EXIT

          # Wait for the server to be ready
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:4173 > /dev/null 2>&1; then
              echo "Vite preview is ready"
              break
            fi
            sleep 1
          done

          # Verify server is responding
          curl -s http://127.0.0.1:4173 | head -5

          # Install lighthouse and run it directly
          npm install -g lighthouse@11.4.0

          # Point Lighthouse at the Chromium that Playwright already installed
          # in the earlier step. Lighthouse otherwise searches system paths and
          # fails with "Unable to connect to Chrome" on the runner.
          CHROME_PATH="$(node -e "process.stdout.write(require('playwright').chromium.executablePath())")"
          export CHROME_PATH
          echo "Using CHROME_PATH=$CHROME_PATH"

          # Infrastructure failures are failures too: a green acceptance job
          # must prove that Lighthouse actually ran and produced a score.
          lighthouse http://127.0.0.1:4173 \
            --output=json --output=html \
            --output-path=./lighthouse-report \
            --chrome-flags="--no-sandbox --headless=new --disable-gpu --disable-dev-shm-usage" \
            --only-categories=accessibility \
            --preset=desktop \
            --quiet

          test -f ./lighthouse-report.report.json

          # A report exists: enforce the real a11y threshold.
          A11Y_SCORE=$(jq '.categories.accessibility.score' ./lighthouse-report.report.json)
          echo "Lighthouse a11y score: $A11Y_SCORE"

          if [ "$A11Y_SCORE" = "null" ] || [ -z "$A11Y_SCORE" ]; then
            echo "::error::Lighthouse report is missing the accessibility score"
            exit 1
          fi

          # Fail only on a genuine sub-threshold accessibility score.
          if (( $(echo "$A11Y_SCORE < 0.95" | bc -l) )); then
            echo "::error::Lighthouse a11y score ($A11Y_SCORE) is below 0.95"
            exit 1
          fi
          echo "A11Y_SCORE=$A11Y_SCORE" >> "$GITHUB_ENV"
        working-directory: packages/web

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: |
            packages/web/lighthouse-report.report.json
            packages/web/lighthouse-report.report.html
          retention-days: 30

  # M14 increment 4: Helm chart validation.
  # Lints the chart and validates rendered manifests against Kubernetes
  # schemas with kubeconform, for both default values and an external-
  # datastore override.
  helm:
    name: helm lint + kubeconform
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        run: |
          curl -fsSL https://get.helm.sh/helm-v3.16.3-linux-amd64.tar.gz -o /tmp/helm.tar.gz
          tar xzf /tmp/helm.tar.gz -C /tmp
          sudo mv /tmp/linux-amd64/helm /usr/local/bin/helm
          helm version

      - name: Install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz -o /tmp/kubeconform.tar.gz
          tar xzf /tmp/kubeconform.tar.gz -C /tmp
          sudo mv /tmp/kubeconform /usr/local/bin/kubeconform
          kubeconform -v

      - name: Helm lint
        run: >-
          helm lint deploy/helm/gambit
          --set secrets.accessTokenSecret=test-only-access-token-secret-32-bytes-minimum
          --set secrets.postgresPassword=test-only-postgres-password
          --set config.nodeEnv=development
          --set email.provider=console

      - name: Helm rejects missing access-token secret
        run: |
          if helm template deploy/helm/gambit >/dev/null 2>&1; then
            echo "::error::chart rendered with a missing access-token secret"
            exit 1
          fi

      - name: Helm template (default values) + kubeconform
        run: |
          helm template deploy/helm/gambit \
            --set secrets.accessTokenSecret=test-only-access-token-secret-32-bytes-minimum \
            --set secrets.postgresPassword=test-only-postgres-password \
            --set config.nodeEnv=development \
            --set email.provider=console \
            | kubeconform -strict -summary

      - name: Helm template (external datastores) + kubeconform
        run: |
          helm template deploy/helm/gambit \
            --set secrets.accessTokenSecret=test-only-access-token-secret-32-bytes-minimum \
            --set config.nodeEnv=development \
            --set email.provider=console \
            --set postgres.enabled=false \
            --set redis.enabled=false \
            --set externalDatabaseUrl=postgres://user:pass@db.example.com:5432/gambit \
            --set externalRedisUrl=redis://redis.example.com:6379 \
            | kubeconform -strict -summary

      - name: Helm template (external secrets) + kubeconform
        run: |
          helm template deploy/helm/gambit \
            --set postgres.enabled=false \
            --set redis.enabled=false \
            --set externalDatabaseUrl=postgres://user:pass@db.example.com:5432/gambit \
            --set externalRedisUrl=redis://redis.example.com:6379 \
            --set secrets.externalSecrets.enabled=true \
            --set secrets.externalSecrets.secretStore.name=gambit-store \
            --set secrets.externalSecrets.accessTokenSecret.key=gambit/access-token \
            --set secrets.externalSecrets.resendApiKey.key=gambit/resend-api-key \
            --set-string email.from=security@example.test \
            --set-string email.publicWebOrigin=https://app.example.test \
            | kubeconform -strict -ignore-missing-schemas -summary

      # M14 inc 9 (ADR-0075): the progressive-delivery strategies render more
      # objects than the default does — a second Deployment and Service per HTTP
      # component, and an extra Ingress — so each one needs its own schema pass.
      - name: Helm template (blue/green) + kubeconform
        run: |
          helm template deploy/helm/gambit \
            --set secrets.accessTokenSecret=test-only-access-token-secret-32-bytes-minimum \
            --set secrets.postgresPassword=test-only-postgres-password \
            --set config.nodeEnv=development \
            --set email.provider=console \
            --set rollout.strategy=blueGreen \
            --set rollout.blueGreen.colors.green.tag=0.2.0 \
            | kubeconform -strict -summary

      - name: Helm template (canary) + kubeconform
        run: |
          helm template deploy/helm/gambit \
            --set secrets.accessTokenSecret=test-only-access-token-secret-32-bytes-minimum \
            --set secrets.postgresPassword=test-only-postgres-password \
            --set config.nodeEnv=development \
            --set email.provider=console \
            --set rollout.strategy=canary \
            --set rollout.canary.tag=0.2.0 \
            --set rollout.canary.weight=25 \
            | kubeconform -strict -summary

      # kubeconform only proves the manifests are SCHEMA-valid. It cannot tell that
      # POSTGRES_PASSWORD is declared before DATABASE_URL (Kubernetes only expands
      # $(VAR) for earlier entries), that the search kill switches reach the right
      # container, or that the indexer stays pinned to one replica. Those are the
      # assertions this script makes, and until now nothing ran it automatically.
      - name: Helm chart snapshot test
        run: |
          # Parses rendered manifests with yq, which the runner image provides.
          # Fail loudly here rather than as a cascade of confusing assertion failures.
          yq --version
          bash scripts/helm-snapshot-test.sh

      # Alerts and dashboards rot silently: rename a metric and the alert simply stops matching,
      # which nobody notices until the incident it was meant to catch. Nothing else in the suite
      # covers it — the rules are YAML and the metrics are TypeScript, and neither imports the
      # other. Runs here because this job needs no services and the check is a few seconds.
      - name: Observability drift check
        run: node scripts/check-observability-drift.mjs

      # M14 inc 10: Enforces deploy-gated pipeline invariants (environment approval gate, non-cancelling
      # queueing concurrency, atomic helm upgrade flags, and release image repository alignment).
      - name: Deployment gate check
        run: npm run check:deploy-gates

      # Pinned, not :latest. This step IS a guardrail, so a floating tool version would let it
      # change behaviour — or start failing — with no commit in this repo to explain why.
      - name: Validate Prometheus rules
        run: |
          docker run --rm -v "$PWD/deploy/observability:/o:ro" \
            --entrypoint promtool prom/prometheus:v3.13.2 \
            check rules /o/prometheus/rules/gambit.rules.yml

