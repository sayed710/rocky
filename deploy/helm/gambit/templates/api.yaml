{{/*
API Deployment(s) + Service(s).
- Runs persistence migrations via an init container before the API starts
  (same `npm run migrate --workspace @chess-platform/persistence` as compose).
- Shares DATABASE_URL with the gateway (both source from the same Secret/ConfigMap).
- Liveness probes hit GET /v1/health; readiness probes hit GET /v1/ready.
- Health-gated ordering via probes: the API won't be Ready until migrations
  complete and the health endpoint responds. The gateway depends on the API
  Service being Ready (via its own readiness probe + init container wait).

M14 inc 9 (ADR-0075): rendered once per rollout variant. With the default
`rollout.strategy: rolling` there is exactly one variant with an empty name
suffix, so this renders the same Deployment and Service it always did. Under
blueGreen/canary a second variant appears with its own Deployment and its own
Service, and the primary Service's selector is what decides which one production
traffic reaches.

Every variant runs the migration init container. Concurrent runs are safe —
`migrate()` holds a database-wide advisory lock (packages/persistence/src/pg/
migrate.ts), so the second one waits and then finds nothing left to apply.
*/}}
{{- $variants := include "gambit.variants" (dict "root" . "component" "api") | fromYamlArray }}
{{- range $v := $variants }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gambit.fullname" $ }}-api{{ $v.service }}
  labels:
    {{- include "gambit.labels" $ | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
    - port: {{ $.Values.api.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "gambit.selectorLabels" $ | nindent 4 }}
    app.kubernetes.io/component: api
    {{- with (include "gambit.variantSelectorLabels" $v) }}{{ . | nindent 4 }}{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gambit.fullname" $ }}-api{{ $v.name }}
  labels:
    {{- include "gambit.labels" $ | nindent 4 }}
    app.kubernetes.io/component: api
    {{- with (include "gambit.variantSelectorLabels" $v) }}{{ . | nindent 4 }}{{- end }}
spec:
  replicas: {{ $v.replicas }}
  selector:
    matchLabels:
      {{- include "gambit.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: api
      {{- with (include "gambit.variantSelectorLabels" $v) }}{{ . | nindent 6 }}{{- end }}
  template:
    metadata:
      labels:
        {{- include "gambit.labels" $ | nindent 8 }}
        app.kubernetes.io/component: api
        {{- with (include "gambit.variantSelectorLabels" $v) }}{{ . | nindent 8 }}{{- end }}
    spec:
      {{- if $.Values.api.migrate.enabled }}
      initContainers:
        - name: migrate
          image: "{{ $.Values.images.api.repository }}:{{ $v.tag }}"
          imagePullPolicy: {{ $.Values.images.api.pullPolicy | quote }}
          command:
            - sh
            - -c
            - "npm run migrate --workspace @chess-platform/persistence"
          env:
            {{- if $.Values.postgres.enabled }}
            # POSTGRES_PASSWORD MUST appear before DATABASE_URL so $(POSTGRES_PASSWORD)
            # expands correctly — Kubernetes only resolves $(VAR) for vars defined
            # earlier in the same env list.
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "gambit.secretName" $ }}
                  key: POSTGRES_PASSWORD
            {{- end }}
            - name: DATABASE_URL
              value: {{ include "gambit.databaseUrl" $ | quote }}
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: {{ include "gambit.configMapName" $ }}
                  key: NODE_ENV
      {{- end }}
      containers:
        - name: api
          image: "{{ $.Values.images.api.repository }}:{{ $v.tag }}"
          imagePullPolicy: {{ $.Values.images.api.pullPolicy | quote }}
          ports:
            - name: http
              containerPort: {{ $.Values.api.port }}
              protocol: TCP
          env:
            {{- if $.Values.postgres.enabled }}
            # POSTGRES_PASSWORD MUST appear before DATABASE_URL so $(POSTGRES_PASSWORD)
            # expands correctly — Kubernetes only resolves $(VAR) for vars defined
            # earlier in the same env list.
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "gambit.secretName" $ }}
                  key: POSTGRES_PASSWORD
            {{- end }}
            - name: DATABASE_URL
              value: {{ include "gambit.databaseUrl" $ | quote }}
            - name: ACCESS_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "gambit.secretName" $ }}
                  key: ACCESS_TOKEN_SECRET
            {{- if eq $.Values.email.provider "resend" }}
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "gambit.secretName" $ }}
                  key: RESEND_API_KEY
            {{- end }}
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "gambit.configMapName" $ }}
                  key: PORT
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: {{ include "gambit.configMapName" $ }}
                  key: NODE_ENV
            - name: EMAIL_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "gambit.configMapName" $ }}
                  key: EMAIL_PROVIDER
            - name: EMAIL_FROM
              valueFrom:
                configMapKeyRef:
                  name: {{ include "gambit.configMapName" $ }}
                  key: EMAIL_FROM
            - name: PUBLIC_WEB_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: {{ include "gambit.configMapName" $ }}
                  key: PUBLIC_WEB_ORIGIN
            - name: EMAIL_TIMEOUT_MS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "gambit.configMapName" $ }}
                  key: EMAIL_TIMEOUT_MS
            - name: TRUST_PROXY
              valueFrom:
                configMapKeyRef:
                  name: {{ include "gambit.configMapName" $ }}
                  key: TRUST_PROXY
            {{- if not $.Values.search.enabled }}
            # M11 (ADR-0055): absolute kill switch. With this set the API never
            # constructs a search repository and GET /v1/search returns 503.
            - name: SEARCH_ENABLED
              value: "0"
            {{- end }}
            {{- if and $.Values.search.enabled (not $.Values.search.semanticEnabled) }}
            # M11 (ADR-0060): disables only ?mode=semantic|hybrid, which then return
            # 503. Redundant when search.enabled is false, since that already stops
            # the semantic repository being constructed at all.
            - name: SEMANTIC_SEARCH_ENABLED
              value: "0"
            {{- end }}
            {{- if $.Values.tracing.enabled }}
            {{- if and (not $.Values.tracing.otlpEndpoint) (not $.Values.tracing.otlpTracesEndpoint) }}
            {{- fail "tracing.enabled requires at least one of tracing.otlpEndpoint or tracing.otlpTracesEndpoint to be set" }}
            {{- end }}
            {{- if $.Values.tracing.otlpEndpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ $.Values.tracing.otlpEndpoint | quote }}
            {{- end }}
            {{- if $.Values.tracing.otlpTracesEndpoint }}
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: {{ $.Values.tracing.otlpTracesEndpoint | quote }}
            {{- end }}
            {{- if $.Values.tracing.samplerArg }}
            - name: OTEL_TRACES_SAMPLER_ARG
              value: {{ $.Values.tracing.samplerArg | quote }}
            {{- end }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /v1/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml $.Values.api.resources | nindent 12 }}
{{- end }}
