{{/*
ConfigMap for non-secret environment variables shared across services.
Secrets (ACCESS_TOKEN_SECRET, POSTGRES_PASSWORD, RESEND_API_KEY) live in the Secret, not here.
*/}}
{{- if and (eq .Values.config.nodeEnv "production") (ne .Values.email.provider "resend") }}
{{- fail "production config requires email.provider=resend" }}
{{- end }}
{{- if not (has .Values.email.provider (list "resend" "console")) }}
{{- fail "email.provider must be resend or console" }}
{{- end }}
{{- if and (eq .Values.email.provider "resend") (empty .Values.email.from) }}
{{- fail "email.from is required when email.provider=resend" }}
{{- end }}
{{- if and (eq .Values.email.provider "resend") (empty .Values.email.publicWebOrigin) }}
{{- fail "email.publicWebOrigin is required when email.provider=resend" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gambit.configMapName" . }}
  labels:
    {{- include "gambit.labels" . | nindent 4 }}
data:
  NODE_ENV: {{ .Values.config.nodeEnv | quote }}
  PORT: {{ .Values.config.apiPort | quote }}
  GATEWAY_PORT: {{ .Values.config.gatewayPort | quote }}
  GATEWAY_HOST: {{ .Values.config.gatewayHost | quote }}
  ACCESS_TOKEN_TTL_SEC: {{ .Values.config.accessTokenTtlSec | quote }}
  CMD_FORWARD_TIMEOUT_MS: {{ .Values.config.cmdForwardTimeoutMs | quote }}
  OWNERSHIP_LEASE_TTL_SEC: {{ .Values.config.ownershipLeaseTtlSec | quote }}
  OWNERSHIP_RENEWAL_INTERVAL_SEC: {{ .Values.config.ownershipRenewalIntervalSec | quote }}
  EMAIL_PROVIDER: {{ .Values.email.provider | quote }}
  EMAIL_FROM: {{ .Values.email.from | quote }}
  PUBLIC_WEB_ORIGIN: {{ .Values.email.publicWebOrigin | quote }}
  EMAIL_TIMEOUT_MS: {{ .Values.email.timeoutMs | quote }}
  TRUST_PROXY: {{ include "gambit.trustProxy" . | quote }}
