# ===========================================================================
# Gambit Helm Chart — values.yaml
# ===========================================================================
# M14 Increment 5: Safe horizontal scaling for the WebSocket gateway.
#
# This chart packages the existing docker-compose stack (postgres, redis, api,
# gateway, web) for Kubernetes. It mirrors the compose wiring:
#   - api + gateway share the same DATABASE_URL (Postgres event store)
#   - gateway gets REDIS_URL + NODE_ID (pod name via downward API; in Compose, NODE_ID is omitted and the gateway uses a random UUID fallback)
#   - web proxies /v1 -> api and /ws -> gateway (nginx, inside the image)
#
# Gateway replicas:
# -----------------
# M14 Increment 5: The gateway now defaults to replicas: 2. Game-command
# ownership is coordinated across replicas via a Redis-based ownership registry
# (ADR-0010). Non-owner nodes forward commands to the owner instead of
# spuriously rejecting them. Redis Pub/Sub remains broadcast-only (ADR-0008).
#
# Prerequisite: REDIS_URL must be set when replicas > 1. The gateway validates
# this at startup and exits with an error if REDIS_URL is absent.
#
# See docs/adr/0010-game-authority-ownership.md for the full design.
#
# The api and web are stateless and default to 2 replicas.
# ===========================================================================

# --- Image references (parameterized; reuse existing Dockerfiles) ---
images:
  api:
    repository: ghcr.io/senasehs19-oss/gambit-api
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  gateway:
    repository: ghcr.io/senasehs19-oss/gambit-gateway
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  web:
    repository: ghcr.io/senasehs19-oss/gambit-web
    tag: "0.1.0"
    pullPolicy: IfNotPresent

# --- Progressive delivery (M14 inc 9, ADR-0075) ---
# How a new version reaches production. Applies to the HTTP tier only — api and
# web. The gateway is deliberately excluded: its connections are long-lived and
# game-command ownership is coordinated across all replicas through Redis
# (ADR-0010), so a version split there would drop live games at the cutover for
# no benefit the rolling update does not already give.
#
#   rolling    Kubernetes' own rolling update. The default, and what this chart
#              did before this block existed.
#   blueGreen  Both versions run. A Service selector — not a pod rollout — picks
#              which one takes traffic, so the cutover and the rollback are the
#              same one-value change and neither restarts a pod.
#   canary     A weighted share of ingress traffic goes to a second track.
#
# Blue/green and canary both run two versions of the API against one database at
# once, so every schema change they carry must be backward compatible with the
# version still serving (expand/contract). ADR-0075 spells out the constraint.
rollout:
  strategy: rolling

  blueGreen:
    # Which color the primary Service selects. Flipping this value is the
    # cutover; setting it back is the rollback.
    activeColor: blue
    # Both colors fall back to images.<component>.tag, so in practice you set the
    # incoming color's tag and leave images.*.tag at the version you would roll
    # back to. The fallback is symmetric on purpose: requiring it on the standby
    # only would make a flip fail to render the moment it was performed.
    # Rendering is rejected if both colors resolve to the same image, since then
    # the preview is a copy of what is live and a flip changes nothing.
    colors:
      blue:
        tag: ""
      green:
        tag: ""
    # The standby color. Rendered alongside the active one and reachable only
    # through the -preview Service and its own Ingress host, so a new version can
    # be smoke-tested against production dependencies before it takes traffic.
    preview:
      enabled: true
      # Standby replica count. Empty means "the same as the active color", which
      # is what makes the flip safe: the cutover is instantaneous, so a standby
      # sized below production capacity would take all of the traffic on the
      # replicas it happens to have and scale up afterwards. The cost of blue/
      # green is that the idle side is a full second copy; setting this lower
      # buys that cost back and turns the flip into a rescale — if you do, scale
      # the standby up in a separate upgrade BEFORE flipping.
      replicas: ""
      # Preview Ingress hostname. Empty means preview.<web.ingress.host>.
      host: ""

  canary:
    # Percentage of ingress traffic sent to the canary track.
    weight: 10
    replicas: 1
    # Image tag for the canary track. Required when strategy=canary; there is no
    # default, because a canary of the running version tests nothing.
    tag: ""
    # Optional deterministic opt-in. When set, a request carrying this header
    # with the value "always" is routed to the canary regardless of weight
    # (ingress-nginx canary-by-header), which is how you test the canary on
    # purpose instead of waiting to be sampled into it.
    header: ""

# --- API service ---
api:
  replicas: 2
  port: 8080
  # Run migrations as an init container before the API starts.
  # Uses the same `npm run migrate --workspace @chess-platform/persistence`
  # that the compose api runs.
  migrate:
    enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# --- Gateway service ---
# M14 inc 5: replicas defaults to 2. Single-owner authority with command
# forwarding (ADR-0010) ensures correct move processing across nodes.
# REDIS_URL is required when replicas > 1.
gateway:
  replicas: 2  # M14 inc 5: safe to scale (single-owner authority + command forwarding, ADR-0010)
  port: 4175
  healthPort: 4176  # port+1, same as compose
  # M9 inc 13 (ADR-0025): host the tournament result reporter in the gateway.
  # When enabled, EVERY gateway replica runs a reporter; optimistic concurrency
  # (version CAS on tournaments) makes duplicate recording attempts safe — the
  # losing replica logs a benign already-recorded error. A dedicated
  # single-replica reporter Deployment is a possible later increment.
  tournamentReporter:
    enabled: false
    scanIntervalMs: 30000
  # M14 inc 7 (ADR-0057): the live search indexer (ADR-0056) runs in its own
  # single-replica Deployment rather than on the scalable gateway replicas.
  # Its dedup set is process-local, so N replicas would each index every
  # finished game — idempotent, but N times the reads and writes.
  # Requires search.enabled=true; the chart fails closed otherwise.
  searchIndexer:
    enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 512Mi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# --- Application network boundary ---
# API and gateway trust proxy-derived client identity, so arbitrary workload
# pods must not bypass the web edge or reach it outside the declared ingress path.
# This requires a CNI that enforces networking.k8s.io/v1 NetworkPolicy.
networkPolicy:
  enabled: true
  # When the chart renders an Ingress, direct pod-to-web traffic would bypass
  # one configured trusted hop. Both selectors are applied to the same source.
  ingressController:
    namespaceLabels:
      kubernetes.io/metadata.name: ingress-nginx
    podLabels:
      app.kubernetes.io/name: ingress-nginx

# --- Web service ---
web:
  replicas: 2
  port: 8080
  ingress:
    enabled: true
    className: nginx
    host: gambit.local
    # TLS is optional; set enabled: true and provide a secret name.
    tls:
      enabled: false
      secretName: gambit-web-tls
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

# --- Postgres (bundled StatefulSet, gated) ---
# Set enabled: false to use an external managed Postgres. When disabled,
# provide externalDatabaseUrl (or set it via --set / a Secret).
postgres:
  enabled: true
  # Postgres 16 plus the `vector` extension, required by migration 0014
  # (ADR-0059). A managed Postgres used via postgres.enabled=false +
  # externalDatabaseUrl must have pgvector available too.
  image: pgvector/pgvector:pg16
  user: gambit
  # POSTGRES_PASSWORD is sourced from secrets.postgresPassword or the Secret
  # named by secrets.existingSecret; it is never stored in non-secret values.
  database: gambit
  port: 5432
  storage: 5Gi
  storageClassName: ""  # empty → cluster default
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

# --- Redis (bundled StatefulSet, gated) ---
# Set enabled: false to use an external managed Redis. When disabled,
# provide externalRedisUrl (or set it via --set / a Secret).
redis:
  enabled: true
  image: redis:7-alpine
  port: 6379
  storage: 1Gi
  storageClassName: ""  # empty → cluster default
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

# --- External datastore URLs (used when postgres.enabled=false / redis.enabled=false) ---
# Set via --set externalDatabaseUrl=postgres://user:pass@host:5432/db
# or --set externalRedisUrl=redis://host:6379
# These can also be provided via a Secret (see secrets section below).
# --- Search (M11) ---
# ADR-0055 defines SEARCH_ENABLED as an absolute kill switch: with search
# disabled the API's search repository is never constructed and GET /v1/search
# returns 503. Left unset here so the API keeps its own default (enabled).
search:
  enabled: true
  # ADR-0060: the semantic/hybrid modes of GET /v1/search (`?mode=semantic|hybrid`).
  # Disabling leaves keyword search untouched and makes those two modes return 503.
  # Nothing populates `search_embeddings` yet, so until an embedding backfill lands
  # the semantic modes answer with an empty page — turning them off is a real choice.
  semanticEnabled: true

externalDatabaseUrl: ""
externalRedisUrl: ""

# --- Transactional email (M15 inc 18, ADR-0126) ---
# The API supports exactly one production transport. PUBLIC_WEB_ORIGIN is an explicit trusted
# origin; links are never derived from request Host / forwarded headers.
email:
  provider: resend
  # Required for Resend. Set these per deployment; no fake production domain is accepted by default.
  from: ""
  publicWebOrigin: ""
  timeoutMs: "5000"

# --- Secrets ---
# ACCESS_TOKEN_SECRET and POSTGRES_PASSWORD are never defaulted. Rendering
# fails until explicit values or an existing Secret are supplied.
# In production, provide via:
#   helm --set secrets.accessTokenSecret=<your-secret> \
#        --set secrets.postgresPassword=<your-password>
# Or use external-secrets / a secrets manager (see docs/adr/0009-kubernetes-helm.md
# and docs/adr/0044-external-secrets.md).
secrets:
  # Existing Secret containing ACCESS_TOKEN_SECRET and, when bundled Postgres
  # is enabled, POSTGRES_PASSWORD. When set, this chart does not create a Secret.
  existingSecret: ""
  # HMAC secret shared between API and gateway (must be >= 32 bytes).
  accessTokenSecret: ""
  postgresPassword: ""

  # --- External Secrets Operator (external-secrets.io) integration ---
  # When enabled, the chart renders an ExternalSecret (instead of the inline
  # Opaque Secret) that ESO reconciles into a Secret named <fullname>-secret,
  # sourced from a SecretStore/ClusterSecretStore. Mutually exclusive with
  # secrets.existingSecret. Requires the External Secrets Operator installed
  # in the cluster and a (Cluster)SecretStore already configured.
  externalSecrets:
    enabled: false
    # Reference to an existing SecretStore or ClusterSecretStore.
    secretStore:
      name: ""
      kind: SecretStore   # or ClusterSecretStore
    # How often ESO re-reads the backing store.
    refreshInterval: 1h
    # Remote references in the backing secrets manager. `key` is the remote
    # secret path/name; `property` (optional) selects a field within it.
    accessTokenSecret:
      key: ""
      property: ""
    postgresPassword:
      key: ""
      property: ""
    resendApiKey:
      key: ""
      property: ""

# --- Config (non-secret env, shared via ConfigMap) ---
config:
  nodeEnv: production
  apiPort: "8080"
  gatewayPort: "4175"
  gatewayHost: "0.0.0.0"
  accessTokenTtlSec: "900"
  # M14 inc 5: command forwarding and ownership lease config
  cmdForwardTimeoutMs: "5000"
  ownershipLeaseTtlSec: "30"
  ownershipRenewalIntervalSec: "15"
  # Trusted reverse proxy hop count (ADR-0141). Empty derives the chart topology:
  # ingress + web nginx = 2; web nginx alone = 1. Set an explicit non-negative
  # integer only when an external topology adds or removes trusted hops.
  trustProxy: ""

# --- Tracing (M13 inc 6, ADR-0062) ---
tracing:
  enabled: false
  otlpEndpoint: ""        # base URL; /v1/traces is appended by resolveOtlpTracesEndpoint
  otlpTracesEndpoint: ""  # set to override the full traces URL verbatim
  samplerArg: ""          # probability in [0,1]; empty means always-on

